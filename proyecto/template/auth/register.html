<div class="card" style="max-width: 420px; margin: 2rem auto;">
    <h2 style="margin-bottom: 1.5rem; color: var(--primary);">Crear Cuenta</h2>
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Laura Gómez" required>
        </div>
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="laura@cosmeticos.com" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Registrar Usuario</button>
    </form>
</div>
