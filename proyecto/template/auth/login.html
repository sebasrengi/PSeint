
<div class="card" style="max-width: 420px; margin: 2rem auto;">
    <h2 style="margin-bottom: 1.5rem; color: var(--primary);">Iniciar Sesión</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="admin@cosmeticos.com" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Entrar</button>
    </form>
    <p style="margin-top: 1rem; font-size: 0.9rem; text-align: center;">
        ¿No tienes cuenta? <a href="{{ url_for('register') }}" style="color: var(--primary);">Regístrate aquí</a>
    </p>
</div>
