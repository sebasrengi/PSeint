<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GlowStock | Inventario Cosmético{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}" class="logo">💄 GlowStock Cosmetics</a>
        <nav>
            <a href="{{ url_for('home.index') }}">Inicio</a>
            <a href="{{ url_for('auth.login') }}">Iniciar Sesión</a>
            <a href="{{ url_for('auth.register') }}">Registrarse</a>
            <a href="{{ url_for('auth.logout') }}">Cerrar Sesión</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        Sistema de Gestión de Inventario Cosmético — Proyecto Placeholder
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
